[project]
name = "imagination-sandbox"
version = "0.1.0"
description = "A minimal starter project scaffold for a new idea."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
